<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Daybat</title>
</head>
<body>
    <section class="general">
        <img src="assets/bg.png" class="bg" alt="" draggable="false">

        <div class="bats-container">
            <img class="bat" src="assets/bat.svg" alt="" draggable="false" />
            <img class="bat" src="assets/bat.svg" alt="" draggable="false" />
            <img class="bat" src="assets/bat.svg" alt="" draggable="false" />
            <img class="bat" src="assets/bat.svg" alt="" draggable="false" />
        </div>

        <div class="icon-panel">
            <div class="icons">
                <img class="icon1 icon" data-role="glass.svg"       src="assets/icon1.svg"  alt="" draggable="false" />
                <img class="icon2 icon" data-role="Coffee_mug.svg"  src="assets/icon2.svg"  alt="" draggable="false" />
                <img class="icon3 icon" data-role="Clipboard.svg"   src="assets/icon3.svg"  alt="" draggable="false" />
                <img class="icon4 icon" data-role="Headphones.svg"  src="assets/icon4.svg"  alt="" draggable="false" />
                <img class="icon5 icon" data-role="Laptop.svg"      src="assets/icon5.svg"  alt="" draggable="false" />
                <img class="icon6 icon" data-role="Safety.svg"      src="assets/icon6.svg"  alt="" draggable="false" />
                <img class="icon7 icon" data-role="Pickaxe.svg"     src="assets/icon7.svg"  alt="" draggable="false" />
                <img class="icon8 icon" data-role="Hard_hat.svg"    src="assets/icon8.svg"  alt="" draggable="false" />
                <img class="icon9 icon" data-role="Straw_hat.svg"   src="assets/icon9.svg"  alt="" draggable="false" />
                <img class="icon10 icon" data-role="Beanie_hat.svg" src="assets/icon10.svg" alt="" draggable="false" />
                <img class="icon11 icon" data-role="Tie.svg"        src="assets/icon11.svg" alt="" draggable="false" />
            </div>
        </div>
    </section>

    <script src="scripts.js"></script>
</body>
</html>
